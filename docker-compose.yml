version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: antiq_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AntiqMorocco!2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'AntiqMorocco!2026' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antiq_api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=AntiqMorocco;User Id=sa;Password=AntiqMorocco!2026;TrustServerCertificate=True;"
      Jwt__Key: "REPLACE_WITH_SECURE_256BIT_KEY_IN_PRODUCTION"
      Jwt__Issuer: "https://api.antiqmorocco.ma"
      Jwt__Audience: "https://antiqmorocco.ma"
      Frontend__Url: "http://localhost:3000"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: antiq_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api/v1"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlserver_data:
